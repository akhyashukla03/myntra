  <rect x="28" y="425" width="319" height="40" rx="6" fill="#2D0A4E"/>
  <text x="40" y="444" fill="#FF3F6C" font-family="sans-serif" font-size="11" font-weight="800">⚡ 2s AI FALLBACK BACKUP ACTIVE</text>
